name: Client release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: Clients to build
        type: choice
        options: [all, android, macos]
        default: all
      source_ref:
        description: Optional source tag/SHA for an artifact-only build
        type: string
        default: ''
      release_tag:
        description: Optional existing Release to attach assets to; also selects its source tag
        type: string
        default: ''
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
      source_ref:
        type: string
        default: ''
      release_tag:
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false

permissions:
  contents: read

concurrency:
  group: client-release-${{ github.event.release.tag_name || inputs.release_tag || github.run_id }}
  cancel-in-progress: false

env:
  ASSET_LABEL: ${{ github.event.release.tag_name || inputs.release_tag || format('build-{0}', github.run_number) }}
  APPLICATION_ID: cn.kmhomelab.persona
  ANDROID_CERT_SHA256: 2ff6ff4540ad36c2275052cd59c16cc2b35f80c11c8a256903222ad2ee7b875e

jobs:
  android:
    if: github.event_name == 'release' || inputs.platform != 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          sparse-checkout: .github/client-release
          persist-credentials: false
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name) || inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || inputs.source_ref || github.sha }}
          path: source
          persist-credentials: false
      - name: Verify packaging helpers and select version
        run: |
          python3 automation/.github/client-release/test_android_release.py
          python3 automation/.github/client-release/android_release.py metadata --source source
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install the SDK versions pinned by the source
        run: |
          python3 automation/.github/client-release/android_release.py sdk-packages --source source > "$RUNNER_TEMP/sdk-packages.txt"
          mapfile -t packages < "$RUNNER_TEMP/sdk-packages.txt"
          sdkmanager "${packages[@]}"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Build all ABI splits and the universal release APK
        working-directory: source/android
        run: |
          ./gradlew --no-daemon --console=plain --max-workers=2 \
            -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PpersonaApplicationId="$APPLICATION_ID" -PpersonaAppLabel=Persona \
            --init-script "$GITHUB_WORKSPACE/automation/.github/client-release/android.init.gradle" \
            :app:assembleRelease
      - name: Check release shrinking when enabled by the source
        run: |
          mapping=source/android/app/build/outputs/mapping/release
          if [[ -f "$mapping/mapping.txt" && -f source/scripts/release/check_android_shrink.py ]]; then
            python3 source/scripts/release/check_android_shrink.py \
              source/android/app/build/outputs/apk/release/app-universal-release-unsigned.apk "$mapping"
          fi
      - name: Sign and verify each architecture
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 automation/.github/client-release/android_release.py sign --source source --sdk "$ANDROID_HOME" --dist dist
      - name: Upload verified Android assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-android-release
          path: dist/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  macos:
    if: github.event_name == 'release' || inputs.platform != 'android'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          sparse-checkout: .github/client-release
          persist-credentials: false
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name) || inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || inputs.source_ref || github.sha }}
          path: source
          persist-credentials: false
      - name: Select release version
        run: python3 automation/.github/client-release/android_release.py metadata --source source
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/server/go.mod
          cache-dependency-path: source/server/go.sum
      - name: Initialize the upstream-compatible Xcode
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          sudo env DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -runFirstLaunch
          xcodebuild -version
          brew install xcodegen
      - name: Build and verify universal desktop and Link apps
        run: bash automation/.github/client-release/macos_release.sh source dist
      - name: Upload verified macOS assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-macos-release
          path: dist/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    needs: [android, macos]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'release' || inputs.release_tag != '') &&
      (needs.android.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download assets from successful client builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: persona-*-release
          path: dist
          merge-multiple: true
      - name: Attach verified assets to the existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          (cd dist && for sums in SHA256SUMS-*.txt; do sha256sum -c "$sums"; done)
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
