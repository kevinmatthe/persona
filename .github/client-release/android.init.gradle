// Applied only by the release workflow; normal developer builds stay unchanged.
gradle.beforeProject { project ->
    project.pluginManager.withPlugin('com.android.application') {
        project.extensions.getByName('androidComponents').finalizeDsl { android ->
            android.defaultConfig.versionCode = Integer.parseInt(System.getenv('PERSONA_RELEASE_VERSION_CODE'))
            android.defaultConfig.versionName = System.getenv('PERSONA_RELEASE_VERSION_NAME')
            android.splits.abi.enable = true
            android.splits.abi.reset()
            android.splits.abi.include('arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64')
            android.splits.abi.universalApk = true
        }
    }
}
